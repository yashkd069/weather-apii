<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Weather Dashboard</title>
  <style>
    :root {
      --bg1: #0f2a4a;
      --bg2: #2563eb;
      --card: rgba(255, 255, 255, .14);
      --text: #ffffff;
      --muted: #cfe0ff;
      --error: #ffb4b4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
      color: var(--text);
      min-height: 100vh;
      background: linear-gradient(160deg, var(--bg1), var(--bg2));
      padding: 40px 20px;
    }

    .app {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      font-size: clamp(1.6rem, 4vw, 2.3rem);
      margin-bottom: 24px;
    }

    /* Search */
    .search {
      display: flex;
      gap: 10px;
      max-width: 520px;
      margin: 0 auto 8px;
    }

    .search input {
      flex: 1;
      padding: 14px 16px;
      border-radius: 12px;
      border: 2px solid transparent;
      font-size: 1rem;
      outline: none;
    }

    .search input:focus {
      border-color: #fbbf24;
    }

    .search input.invalid {
      border-color: #ef4444;
    }

    .search button {
      padding: 14px 22px;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      background: #fbbf24;
      color: #3b2300;
      font-weight: 700;
      font-size: 1rem;
      transition: transform .15s, background .2s;
    }

    .search button:hover {
      background: #f59e0b;
    }

    .search button:active {
      transform: scale(.96);
    }

    .search button:disabled {
      opacity: .6;
      cursor: wait;
    }

    /* Messages */
    #message {
      text-align: center;
      min-height: 28px;
      margin: 10px 0 22px;
      color: var(--error);
      font-weight: 600;
    }

    #message.info {
      color: var(--muted);
    }

    /* Current weather */
    .current {
      background: var(--card);
      backdrop-filter: blur(6px);
      border-radius: 22px;
      padding: 28px;
      margin-bottom: 26px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .current .city {
      font-size: 1.6rem;
      font-weight: 700;
    }

    .current .date {
      color: var(--muted);
      margin-top: 4px;
    }

    .current .desc {
      margin-top: 10px;
      font-size: 1.1rem;
    }

    .temp-block {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .temp-block .icon {
      font-size: 4.2rem;
      line-height: 1;
    }

    .temp-block .temp {
      font-size: 3.6rem;
      font-weight: 800;
    }

    .details {
      display: flex;
      gap: 22px;
      color: var(--muted);
    }

    .details strong {
      display: block;
      color: var(--text);
      font-size: 1.15rem;
    }

    /* Forecast */
    .forecast-title {
      margin-bottom: 14px;
      font-size: 1.2rem;
    }

    .forecast {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
    }

    .day {
      background: var(--card);
      border-radius: 18px;
      padding: 18px 10px;
      text-align: center;
      transition: transform .25s;
    }

    .day:hover {
      transform: translateY(-6px);
    }

    .day .name {
      font-weight: 600;
      margin-bottom: 8px;
    }

    .day .icon {
      font-size: 2.3rem;
      margin-bottom: 6px;
    }

    .day .range {
      color: var(--muted);
    }

    .day .range b {
      color: var(--text);
    }

    .hidden {
      display: none;
    }

    /* Loader */
    .loader {
      width: 38px;
      height: 38px;
      margin: 30px auto;
      border: 4px solid rgba(255, 255, 255, .3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 720px) {
      .forecast {
        grid-template-columns: repeat(2, 1fr);
      }

      .current {
        flex-direction: column;
        text-align: center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <h1>🌤️ Live Weather Dashboard</h1>

    <form class="search" id="searchForm" novalidate>
      <input type="text" id="cityInput" placeholder="Search a city (e.g. Delhi)" aria-label="City name"
        autocomplete="off">
      <button type="submit" id="searchBtn">Search</button>
    </form>
    <p id="message" role="alert"></p>

    <div id="loader" class="loader hidden" aria-label="Loading"></div>
    <section id="result" class="hidden"></section>
  </div>

  <script>
    const GEO_URL = "https://geocoding-api.open-meteo.com/v1/search";
    const WEATHER_URL = "https://api.open-meteo.com/v1/forecast";

    const form = document.getElementById("searchForm");
    const input = document.getElementById("cityInput");
    const btn = document.getElementById("searchBtn");
    const messageEl = document.getElementById("message");
    const loaderEl = document.getElementById("loader");
    const resultEl = document.getElementById("result");

    // Weather code -> icon and description (WMO codes used by Open-Meteo)
    function describe(code) {
      if (code === 0) return { icon: "☀️", text: "Clear sky" };
      if (code <= 2) return { icon: "🌤️", text: "Partly cloudy" };
      if (code === 3) return { icon: "☁️", text: "Overcast" };
      if (code <= 48) return { icon: "🌫️", text: "Fog" };
      if (code <= 57) return { icon: "🌦️", text: "Drizzle" };
      if (code <= 67) return { icon: "🌧️", text: "Rain" };
      if (code <= 77) return { icon: "❄️", text: "Snow" };
      if (code <= 82) return { icon: "🌧️", text: "Rain showers" };
      if (code <= 86) return { icon: "🌨️", text: "Snow showers" };
      return { icon: "⛈️", text: "Thunderstorm" };
    }

    function escapeHTML(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function showMessage(text, isInfo = false) {
      messageEl.textContent = text;
      messageEl.classList.toggle("info", isInfo);
    }

    function setLoading(isLoading) {
      loaderEl.classList.toggle("hidden", !isLoading);
      btn.disabled = isLoading;
    }

    // Input validation: not empty, letters/spaces/.,'- only, 2+ chars
    function validateCity(value) {
      if (!value) return "Please enter a city name.";
      if (value.length < 2) return "City name must be at least 2 characters.";
      if (!/^[\p{L}\s.,'-]+$/u.test(value)) return "City name can only contain letters and spaces.";
      return "";
    }

    async function fetchJSON(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Server error (${res.status}). Please try again.`);
      return res.json();
    }

    async function getWeather(city) {
      const geo = await fetchJSON(`${GEO_URL}?name=${encodeURIComponent(city)}&count=1&language=en&format=json`);
      if (!geo.results || geo.results.length === 0) {
        throw new Error(`No city found for "${city}". Check the spelling and try again.`);
      }
      const place = geo.results[0];
      const params = new URLSearchParams({
        latitude: place.latitude,
        longitude: place.longitude,
        current: "temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code",
        daily: "weather_code,temperature_2m_max,temperature_2m_min",
        timezone: "auto",
        forecast_days: 5
      });
      const data = await fetchJSON(`${WEATHER_URL}?${params}`);
      return { place, data };
    }

    function renderWeather({ place, data }) {
      const cur = data.current;
      const now = describe(cur.weather_code);
      const cityLabel = [place.name, place.admin1, place.country].filter(Boolean).join(", ");
      const today = new Date().toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "long", year: "numeric" });

      const days = data.daily.time.map((d, i) => {
        const info = describe(data.daily.weather_code[i]);
        const name = i === 0 ? "Today" : new Date(d).toLocaleDateString("en-US", { weekday: "short" });
        return `
        <div class="day">
          <div class="name">${name}</div>
          <div class="icon" title="${info.text}">${info.icon}</div>
          <div class="range"><b>${Math.round(data.daily.temperature_2m_max[i])}°</b> / ${Math.round(data.daily.temperature_2m_min[i])}°</div>
        </div>`;
      }).join("");

      resultEl.innerHTML = `
      <div class="current">
        <div>
          <div class="city">${escapeHTML(cityLabel)}</div>
          <div class="date">${today}</div>
          <div class="desc">${now.text}</div>
        </div>
        <div class="temp-block">
          <span class="icon">${now.icon}</span>
          <span class="temp">${Math.round(cur.temperature_2m)}°C</span>
        </div>
        <div class="details">
          <div>Humidity<strong>${cur.relative_humidity_2m}%</strong></div>
          <div>Wind<strong>${Math.round(cur.wind_speed_10m)} km/h</strong></div>
        </div>
      </div>
      <h2 class="forecast-title">5-day forecast</h2>
      <div class="forecast">${days}</div>`;
      resultEl.classList.remove("hidden");
    }

    async function search(city) {
      const error = validateCity(city);
      input.classList.toggle("invalid", Boolean(error));
      if (error) {
        showMessage(error);
        return;
      }
      showMessage("");
      resultEl.classList.add("hidden");
      setLoading(true);
      try {
        const weather = await getWeather(city);
        renderWeather(weather);
      } catch (err) {
        // fetch() itself throws a TypeError when offline
        const msg = err instanceof TypeError
          ? "Network problem. Check your internet connection."
          : err.message;
        showMessage(msg);
      } finally {
        setLoading(false);
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      search(input.value.trim());
    });

    input.addEventListener("input", () => {
      input.classList.remove("invalid");
      showMessage("");
    });

    // Load a default city on start
    search("Delhi");
  </script>
</body>

</html>
